<!DOCTYPE html>
<html lang="es" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password — SITÙCKA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/output.css" />
    <link rel="stylesheet" href="./css/auth.css" />
  </head>
  <body class="min-h-full bg-white font-sans text-neutral-900 antialiased">
    <div class="flex min-h-screen lg:grid lg:min-h-screen lg:grid-cols-[minmax(0,44%)_minmax(0,56%)]">
      <!-- Forgot password form -->
      <div
        class="auth-panel px-5 pt-6 pb-8 xs:px-7 xs:pt-8 sm:px-10 sm:pt-10 sm:pb-10 md:px-12 lg:px-14 lg:py-12 xl:px-16"
      >
        <div class="mx-auto w-full max-w-md">
          <a href="./index.html" class="mb-6 inline-flex sm:mb-8">
            <img
              src="./assets/logo-basket.svg"
              alt="SITÙCKA - Tu cesta de la compra"
              class="h-14 w-auto xs:h-16 sm:h-[4.5rem] md:h-20"
              width="200"
              height="94"
            />
          </a>

          <h1 class="mb-2 text-2xl font-bold text-neutral-900 sm:mb-3 sm:text-3xl lg:text-[2rem]">
            Forgot Your Password?
          </h1>
          <p class="mb-6 text-sm leading-relaxed text-neutral-500 sm:mb-8 sm:text-base">
            Type your email and we will send you a reset link for your password.
          </p>

          <form id="forgot-form" class="w-full" novalidate>
            <div class="mb-5 sm:mb-6">
              <label for="email" class="mb-1.5 block text-sm font-medium text-neutral-800">
                Email <span class="text-red-500">*</span>
              </label>
              <input
                id="email"
                name="email"
                type="email"
                placeholder="davidjosh32@gmail.com"
                required
                autocomplete="email"
                aria-describedby="email-error"
                aria-invalid="false"
                class="w-full rounded-xl border border-hero-yellow bg-white px-3 py-2.5 text-sm text-neutral-800 outline-none transition-colors placeholder:text-neutral-400 focus:border-hero-yellow focus:ring-2 focus:ring-hero-yellow/20 sm:px-4 sm:py-3"
              />
              <p id="email-error" class="mt-1.5 hidden text-xs text-red-500 sm:text-sm" role="alert">
                Email address is incorrect, please re-enter
              </p>
            </div>

            <button
              type="submit"
              class="mb-8 w-full rounded-xl bg-hero-yellow py-3 text-base font-bold text-white transition-colors hover:bg-brand-orange-dark sm:mb-10 sm:py-3.5"
            >
              Send Email
            </button>
          </form>

          <a
            href="./login.html"
            class="flex w-full items-center justify-center gap-1.5 text-sm font-medium text-neutral-600 transition-colors hover:text-neutral-900"
          >
            <svg
              class="h-4 w-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M15 18 9 12l6-6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            Back to Login
          </a>
        </div>
      </div>

      <!-- Illustration (desktop only) -->
      <div class="relative hidden min-h-[280px] overflow-hidden bg-surface-peach lg:block lg:min-h-screen">
        <img
          src="./assets/login-img.svg"
          alt="Delivery rider on a scooter in the city"
          class="h-full w-full object-cover object-center"
          width="1085"
          height="1024"
        />
      </div>
    </div>

    <script>
      const form = document.getElementById("forgot-form");
      const emailInput = document.getElementById("email");
      const emailError = document.getElementById("email-error");

      function showEmailError() {
        emailError.classList.remove("hidden");
        emailInput.setAttribute("aria-invalid", "true");
        emailInput.classList.add("border-red-500", "focus:border-red-500", "focus:ring-red-500/20");
        emailInput.classList.remove("border-hero-yellow", "focus:border-hero-yellow", "focus:ring-hero-yellow/20");
      }

      function clearEmailError() {
        emailError.classList.add("hidden");
        emailInput.setAttribute("aria-invalid", "false");
        emailInput.classList.remove("border-red-500", "focus:border-red-500", "focus:ring-red-500/20");
        emailInput.classList.add("border-hero-yellow", "focus:border-hero-yellow", "focus:ring-hero-yellow/20");
      }

      emailInput.addEventListener("input", () => {
        if (!emailError.classList.contains("hidden")) clearEmailError();
      });

      const emailParam = new URLSearchParams(window.location.search).get("email");
      if (emailParam) {
        emailInput.value = emailParam;
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const value = emailInput.value.trim();
        const valid = value.length > 0 && emailInput.checkValidity();

        if (!valid) {
          showEmailError();
          emailInput.focus();
          return;
        }

        clearEmailError();
        const email = encodeURIComponent(value);
        window.location.href = `./otp.html?email=${email}`;
      });
    </script>
  </body>
</html>
