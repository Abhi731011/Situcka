<!DOCTYPE html>
<html lang="es" class="h-full overflow-hidden">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In — SITÙCKA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/output.css" />
  </head>
  <body class="h-full overflow-hidden bg-white font-sans text-neutral-900 antialiased">
    <div class="flex h-full lg:grid lg:grid-cols-[minmax(0,44%)_minmax(0,56%)]">
      <!-- Login form -->
      <div
        class="flex h-full w-full flex-col justify-center overflow-hidden px-5 py-6 xs:px-7 sm:px-10 md:px-12 lg:px-14 xl:px-16"
      >
        <a href="./index.html" class="mb-4 inline-flex w-fit sm:mb-5">
          <img
            src="./assets/logo-basket.svg"
            alt="SITÙCKA - Tu cesta de la compra"
            class="h-7 w-auto sm:h-8 md:h-9"
            width="153"
            height="72"
          />
        </a>

        <h1 class="mb-4 text-xl font-bold text-neutral-900 sm:mb-5 sm:text-2xl lg:text-3xl">
          Welcome Back
        </h1>

        <form class="w-full max-w-md" action="#" method="post">
          <div class="mb-3 sm:mb-4">
            <label for="email" class="mb-1 block text-xs font-medium text-neutral-800 sm:text-sm">
              Email <span class="text-red-500">*</span>
            </label>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="davidjosh32@gmail.com"
              required
              class="w-full rounded-xl border border-hero-yellow/60 bg-white px-3 py-2.5 text-sm text-neutral-800 outline-none transition-colors placeholder:text-neutral-400 focus:border-hero-yellow focus:ring-2 focus:ring-hero-yellow/20 sm:px-4 sm:py-3"
            />
          </div>

          <div class="mb-4 sm:mb-5">
            <label for="password" class="mb-1 block text-xs font-medium text-neutral-800 sm:text-sm">
              Password <span class="text-red-500">*</span>
            </label>
            <div class="relative">
              <input
                id="password"
                name="password"
                type="password"
                placeholder="Enter your password"
                required
                class="w-full rounded-xl border border-hero-yellow/60 bg-white py-2.5 pl-3 pr-11 text-sm text-neutral-800 outline-none transition-colors placeholder:text-neutral-400 focus:border-hero-yellow focus:ring-2 focus:ring-hero-yellow/20 sm:py-3 sm:pl-4 sm:pr-12"
              />
              <button
                type="button"
                id="toggle-password"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-400 transition-colors hover:text-neutral-600"
                aria-label="Show password"
              >
                <svg
                  id="eye-icon"
                  class="h-4 w-4 sm:h-5 sm:w-5"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  aria-hidden="true"
                >
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <button
            type="submit"
            class="mb-4 w-full rounded-xl bg-hero-yellow py-2.5 text-sm font-bold text-white transition-colors hover:bg-brand-orange-dark sm:mb-5 sm:py-3 sm:text-base"
          >
            Login
          </button>
        </form>

        <div class="mb-3 flex max-w-md items-center gap-2 sm:mb-4 sm:gap-3">
          <span class="h-px flex-1 bg-neutral-200"></span>
          <span class="shrink-0 text-xs text-neutral-500 sm:text-sm">or Continue with</span>
          <span class="h-px flex-1 bg-neutral-200"></span>
        </div>

        <div class="mb-3 flex max-w-md items-center justify-center gap-3 sm:mb-4 sm:gap-4">
          <a
            href="#"
            class="flex h-9 w-9 items-center justify-center rounded-full bg-[#1877F2] text-white transition-opacity hover:opacity-90 sm:h-10 sm:w-10"
            aria-label="Continue with Facebook"
          >
            <svg class="h-4 w-4 sm:h-5 sm:w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path
                d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"
              />
            </svg>
          </a>
          <a
            href="#"
            class="flex h-9 w-9 items-center justify-center rounded-full border border-neutral-200 bg-white transition-opacity hover:opacity-90 sm:h-10 sm:w-10"
            aria-label="Continue with Google"
          >
            <svg class="h-4 w-4 sm:h-5 sm:w-5" viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="#4285F4"
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              />
              <path
                fill="#34A853"
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              />
              <path
                fill="#FBBC05"
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
              />
              <path
                fill="#EA4335"
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              />
            </svg>
          </a>
          <a
            href="#"
            class="flex h-9 w-9 items-center justify-center rounded-full bg-neutral-900 text-white transition-opacity hover:opacity-90 sm:h-10 sm:w-10"
            aria-label="Continue with Apple"
          >
            <svg class="h-4 w-4 sm:h-5 sm:w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path
                d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"
              />
            </svg>
          </a>
        </div>

        <label
          class="flex max-w-md cursor-pointer items-start gap-2 text-[11px] leading-snug text-neutral-600 sm:gap-3 sm:text-xs sm:leading-relaxed"
        >
          <input
            type="checkbox"
            checked
            class="mt-0.5 h-3.5 w-3.5 shrink-0 rounded border-neutral-300 text-hero-yellow focus:ring-hero-yellow sm:h-4 sm:w-4"
          />
          <span>
            I agree to
            <a href="#" class="font-medium text-hero-yellow underline hover:text-brand-orange-dark"
              >Terms of Service</a
            >
            and
            <a href="#" class="font-medium text-hero-yellow underline hover:text-brand-orange-dark"
              >Privacy Policy</a
            >
            or
            <a href="#" class="font-medium text-hero-yellow underline hover:text-brand-orange-dark"
              >Need Help?</a
            >
          </span>
        </label>
      </div>

      <!-- Illustration (desktop only) -->
      <div class="relative hidden h-full overflow-hidden bg-surface-peach lg:block">
        <img
          src="./assets/login-img.svg"
          alt="Delivery rider on a scooter in the city"
          class="h-full w-full object-cover object-center"
          width="1085"
          height="1024"
        />
      </div>
    </div>

    <script>
      const passwordInput = document.getElementById("password");
      const toggleBtn = document.getElementById("toggle-password") ;
      const eyeIcon = document.getElementById("eye-icon");

      toggleBtn.addEventListener("click", () => {
        const isHidden = passwordInput.type === "password";
        passwordInput.type = isHidden ? "text" : "password";
        toggleBtn.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
        eyeIcon.innerHTML = isHidden
          ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
          : '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
      });
    </script>
  </body>
</html>
