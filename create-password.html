<!DOCTYPE html>
<html lang="es" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create New Password — SITÙCKA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/output.css" />
    <link rel="stylesheet" href="./css/auth.css" />
  </head>
  <body class="min-h-full bg-white font-sans text-neutral-900 antialiased">
    <div class="flex min-h-screen lg:grid lg:min-h-screen lg:grid-cols-[minmax(0,44%)_minmax(0,56%)]">
      <!-- Create password form -->
      <div
        class="auth-panel px-5 pt-6 pb-8 xs:px-7 xs:pt-8 sm:px-10 sm:pt-10 sm:pb-10 md:px-12 lg:px-14 lg:py-12 xl:px-16"
      >
        <div class="mx-auto w-full max-w-md">
          <a href="./index.html" class="mb-6 inline-flex sm:mb-8">
            <img
              src="./assets/logo-basket.svg"
              alt="SITÙCKA - Tu cesta de la compra"
              class="h-14 w-auto xs:h-16 sm:h-[4.5rem] md:h-20"
              width="200"
              height="94"
            />
          </a>

          <h1 class="mb-2 text-2xl font-bold text-neutral-900 sm:mb-3 sm:text-3xl lg:text-[2rem]">
            Create New Password
          </h1>
          <p class="mb-6 text-sm leading-relaxed text-neutral-500 sm:mb-8 sm:text-base">
            Create a new password and protect your account.
          </p>

          <form id="reset-form" class="w-full" novalidate>
            <div class="mb-4 sm:mb-5">
              <label for="password" class="mb-1.5 block text-sm font-medium text-neutral-800">
                Password <span class="text-red-500">*</span>
              </label>
              <div class="relative">
                <input
                  id="password"
                  name="password"
                  type="password"
                  placeholder="DAvidjosh332@"
                  required
                  autocomplete="new-password"
                  class="w-full rounded-xl border border-hero-yellow bg-white py-2.5 pl-3 pr-11 text-sm text-neutral-800 outline-none transition-colors placeholder:text-neutral-400 focus:border-hero-yellow focus:ring-2 focus:ring-hero-yellow/20 sm:py-3 sm:pl-4 sm:pr-12"
                />
                <button
                  type="button"
                  class="password-toggle absolute right-3 top-1/2 -translate-y-1/2 text-neutral-400 transition-colors hover:text-neutral-600"
                  data-target="password"
                  aria-label="Show password"
                >
                  <svg
                    class="h-4 w-4 sm:h-5 sm:w-5"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    aria-hidden="true"
                  >
                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
              </div>
            </div>

            <div class="mb-6 sm:mb-8">
              <label for="confirm-password" class="mb-1.5 block text-sm font-medium text-neutral-800">
                Re-enter Password <span class="text-red-500">*</span>
              </label>
              <div class="relative">
                <input
                  id="confirm-password"
                  name="confirmPassword"
                  type="password"
                  placeholder="DAvidjosh332@"
                  required
                  autocomplete="new-password"
                  class="w-full rounded-xl border border-hero-yellow bg-white py-2.5 pl-3 pr-11 text-sm text-neutral-800 outline-none transition-colors placeholder:text-neutral-400 focus:border-hero-yellow focus:ring-2 focus:ring-hero-yellow/20 sm:py-3 sm:pl-4 sm:pr-12"
                />
                <button
                  type="button"
                  class="password-toggle absolute right-3 top-1/2 -translate-y-1/2 text-neutral-400 transition-colors hover:text-neutral-600"
                  data-target="confirm-password"
                  aria-label="Show password"
                >
                  <svg
                    class="h-4 w-4 sm:h-5 sm:w-5"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    aria-hidden="true"
                  >
                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
              </div>
              <p id="confirm-error" class="mt-1.5 hidden text-xs text-red-500" role="alert">
                Passwords do not match
              </p>
            </div>

            <button
              type="submit"
              class="w-full rounded-xl bg-hero-yellow py-3 text-base font-bold text-white transition-colors hover:bg-brand-orange-dark sm:py-3.5"
            >
              Continue
            </button>
          </form>
        </div>
      </div>

      <!-- Illustration (desktop only) -->
      <div class="relative hidden min-h-[280px] overflow-hidden bg-surface-peach lg:block lg:min-h-screen">
        <img
          src="./assets/login-img.svg"
          alt="Delivery rider on a scooter in the city"
          class="h-full w-full object-cover object-center"
          width="1085"
          height="1024"
        />
      </div>
    </div>

    <div class="reset-success" id="reset-success" hidden>
      <button
        class="reset-success__overlay"
        type="button"
        data-close-reset-success
        aria-label="Close modal"
      ></button>
      <div
        class="reset-success__dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="reset-success-title"
        aria-describedby="reset-success-desc"
      >
        <button
          class="reset-success__close"
          type="button"
          data-close-reset-success
          aria-label="Close"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>

        <h2 class="reset-success__title" id="reset-success-title">
          Password Reset Successfully!
          <img class="reset-success__tick" src="./assets/tick.svg" alt="" aria-hidden="true" />
        </h2>
        <p class="reset-success__copy" id="reset-success-desc">
          Your password has been updated. You can now sign in using your new password.
        </p>
        <a class="reset-success__btn" href="./login.html">Back To Log in</a>
      </div>
    </div>

    <script>
      const form = document.getElementById("reset-form");
      const passwordInput = document.getElementById("password");
      const confirmInput = document.getElementById("confirm-password");
      const confirmError = document.getElementById("confirm-error");
      const successModal = document.getElementById("reset-success");

      function openSuccessModal() {
        if (!successModal) return;
        successModal.hidden = false;
        document.body.classList.add("reset-success-open");
        successModal.querySelector(".reset-success__btn")?.focus();
      }

      function closeSuccessModal() {
        if (!successModal) return;
        successModal.hidden = true;
        document.body.classList.remove("reset-success-open");
      }

      passwordInput.addEventListener("input", () => {
        if (!confirmError.classList.contains("hidden") && confirmInput.value === passwordInput.value) {
          confirmError.classList.add("hidden");
        }
      });

      confirmInput.addEventListener("input", () => {
        if (confirmInput.value === passwordInput.value) {
          confirmError.classList.add("hidden");
        }
      });

      document.querySelectorAll(".password-toggle").forEach((btn) => {
        btn.addEventListener("click", () => {
          const input = document.getElementById(btn.dataset.target);
          if (!input) return;
          const showing = input.type === "text";
          input.type = showing ? "password" : "text";
          btn.setAttribute("aria-label", showing ? "Show password" : "Hide password");
          const svg = btn.querySelector("svg");
          if (!svg) return;
          svg.innerHTML = showing
            ? '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" /><circle cx="12" cy="12" r="3" />'
            : '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" /><line x1="1" y1="1" x2="23" y2="23" />';
        });
      });

      document.querySelectorAll("[data-close-reset-success]").forEach((btn) => {
        btn.addEventListener("click", closeSuccessModal);
      });

      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && successModal && !successModal.hidden) {
          closeSuccessModal();
        }
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const password = passwordInput.value.trim();
        const confirm = confirmInput.value.trim();

        if (!password) {
          passwordInput.focus();
          return;
        }

        if (password !== confirm) {
          confirmError.classList.remove("hidden");
          confirmInput.focus();
          return;
        }

        confirmError.classList.add("hidden");
        openSuccessModal();
      });
    </script>
  </body>
</html>
